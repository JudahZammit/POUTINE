# Development and runtime environment for POUTINE.
#
#   micromamba create -n poutine -f conda-lock.yml     (exact, reproducible; or: conda-lock install -n poutine conda-lock.yml)
#   micromamba activate poutine
#   mvn package                                        # builds target/poutine-<version>.jar
#
# This file says what we ask for; conda-lock.yml records exactly what we get (all packages, versions and checksums).
# Re-lock after editing this file. See docs/environment.md.
#
# Everything that affects results is pinned: the JDK and Maven that build the program, and treetime, which
# produces the ancestral reconstruction POUTINE consumes.
channels:
  - conda-forge
  - bioconda
  - nodefaults
# Only Linux is supported (treetime does not run on Windows, and macOS is not a target). Used by conda-lock only;
# conda and micromamba ignore it.
platforms:
  - linux-64
dependencies:
  # Build and runtime JDK. The pom.xml requires JDK 21 to build and targets Java 21 bytecode: one version everywhere.
  - openjdk=21
  # Pinned here instead of using a committed Maven Wrapper (see PLAN.md).
  - maven=3.9.16
  # PROVISIONAL pin. The README says 0.8.6 and the preprint used 0.7.6; 0.12.1 is what the committed fixtures'
  # ancestral reconstructions were made with. Final choice is pending the treetime comparison in PLAN.md.
  - treetime=0.12.1
