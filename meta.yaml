# Local conda recipe. Build and install from the repository root:
#   conda build . -c conda-forge -c bioconda
#   conda install --use-local poutine -c conda-forge -c bioconda
{% set version = "1.0.2" %}  # keep in step with <version> in pom.xml and the version strings in Homoplasy_Counter.java

package:
  name: poutine
  version: {{ version }}

source:
  path: .

build:
  number: 0
  noarch: python  # a jar plus a Python launcher, nothing compiled per platform
  entry_points:
    - poutine = poutine_launcher:main

requirements:
  build:
    - openjdk 21.*
    - maven >=3.9
  host:
    - python
  run:
    - python
    - openjdk >=21
    - treetime 0.12.1

about:
  home: https://github.com/Peter-Two-Point-O/POUTINE
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A homoplasy-counting GWAS tool for microbial genomes
